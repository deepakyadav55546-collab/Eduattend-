services:
  postgres:
    image: postgres:16-alpine
    container_name: eduattend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eduattend
    ports:
      - "5432:5432"
    volumes:
      - eduattend_pgdata:/var/lib/postgresql/data

volumes:
  eduattend_pgdata:
